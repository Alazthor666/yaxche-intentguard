[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "yaxche-intentguard"
version = "0.1.0"
description = "Adaptive collaborative AI agent that clarifies intent before taking action."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Mario Alberto Ramirez Torres"}]
dependencies = [
  "google-adk>=1.0.0",
  "google-genai>=2.0.0",
  "google-cloud-firestore>=2.29.0",
  "fastapi>=0.133.0",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
