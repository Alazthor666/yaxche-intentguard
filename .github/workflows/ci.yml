name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run deterministic unit tests
        run: pytest -q tests/unit

      - name: Import ADK app without live model call
        env:
          INTENTGUARD_MODEL: gemini-3.5-flash
          INTENTGUARD_STORAGE: memory
        run: python -c "from app.agent import app, root_agent; print(root_agent.name)"
